services:
  - type: web
    name: vortex-api
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: ICMR_PARALLEL
        value: "2"
      - key: ICMR_THREADS_PER_CONN
        value: "2"
      - key: ICMR_INDEX_SOURCE
        value: remote
    disk:
      name: vortex-data
      mountPath: /data
      sizeGB: 1
